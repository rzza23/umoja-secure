services:
  postgres:
    image: postgres:16-alpine
    container_name: umoja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: umoja
      POSTGRES_PASSWORD: umoja
      POSTGRES_DB: umoja
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - umoja-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umoja -d umoja']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  umoja-pg-data:
